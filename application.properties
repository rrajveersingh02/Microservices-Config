spring.datasource.name=New
spring.datasource.url=jdbc:mysql://localhost:3306/microservices
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.cloud.gateway.server.webmvc.routes[0].id=StudentService
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://StudentService
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/student/**
spring.cloud.gateway.server.webmvc.routes[1].id=CourseService
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://CourseService
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/course/**
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
